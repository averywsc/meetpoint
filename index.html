<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Meetpoint · the fairest place to meet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M6 8L16 16M26 8L16 16M16 27V16' stroke='%23fff' stroke-width='2' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* picture a plain black and white map filling the screen, with one almost see-through pane of frosted glass floating over its left side. there are no rules, borders or underlines anywhere: fields are soft grey pills, buttons are soft pills, and the one important button is solid black. each person has a small numbered dot, and when the answer arrives it appears in the same pane as quiet type. on the map each person is a black numbered dot, their road route is one clean solid line that draws itself in, and the meeting place is a white circle with a star. on a phone the pane sits at the bottom like a sheet. everything is black, white and grey, and flips to white on black in dark mode. motion is small, uses one springy curve, and stops if you ask for reduced motion. the app has one look on purpose: with no colour and no lines on the surface, the map and the routes are all you notice. */
:root{--bg:#fff;--gl:#ffffffb8;--tx:#111;--mu:#777;--fill:#0000000d;--fill2:#0000001a;--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;--e:cubic-bezier(.34,1.4,.64,1)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--gl:#111111b8;--tx:#fff;--mu:#999;--fill:#ffffff14;--fill2:#ffffff26}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:400 15px/1.45 var(--ui);color:var(--tx);overflow:hidden}
#map{position:absolute;inset:0;background:#ddd}
#map.pick{cursor:crosshair}
.leaflet-tile-pane{filter:grayscale(1)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:grayscale(1) invert(1) contrast(.9)}}
/*---------- pane ----------*/
#card{position:absolute;z-index:1100;left:16px;top:16px;bottom:16px;width:320px;overflow:auto;padding:20px;background:var(--gl);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:22px;box-shadow:0 10px 40px #0002;animation:up .5s var(--e) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1{margin:0 0 14px;font:600 20px/1 var(--ui);letter-spacing:-.02em}
.mu{color:var(--mu);font-size:13px}
.pr{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;margin-bottom:10px;animation:up .4s var(--e) both}
.pr i{width:22px;height:22px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font:600 12px var(--ui);font-style:normal}
.f{display:grid;gap:4px;min-width:0}
input,button{font:inherit;color:var(--tx)}
input{width:100%;min-width:0;padding:9px 12px;border:0;border-radius:12px;background:var(--fill);transition:background .2s}
input:focus{background:var(--fill2);outline:0}
input::placeholder{color:var(--mu)}
button,.lk{padding:6px 14px;min-height:34px;border:0;border-radius:999px;background:var(--fill);font-weight:500;cursor:pointer;text-decoration:none;color:var(--tx);display:inline-flex;align-items:center;transition:transform .3s var(--e),background .2s}
button:hover,.lk:hover{transform:translateY(-2px);background:var(--fill2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default;transform:none}
.sm{display:flex;gap:4px}
.sm button{min-height:28px;padding:2px 10px;font-size:13px}
#go{width:100%;min-height:46px;margin-top:8px;background:var(--tx);color:var(--bg);font-size:16px;font-weight:600;justify-content:center}
#go:hover{background:var(--tx);opacity:.88}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;justify-content:center}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.sg{position:absolute;z-index:5;left:30px;right:0;top:100%;margin:0;padding:4px;list-style:none;background:var(--bg);border-radius:12px;box-shadow:0 8px 30px #0003}
.sg:empty{display:none}
.sg li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.sg li:hover{background:var(--fill2)}
button:focus-visible,.lk:focus-visible,.sg li:focus-visible,input:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
#st:empty{display:none}
#st{margin:10px 0 0;color:var(--mu);font-size:14px}
#st.er{color:var(--tx);font-weight:600}
/*---------- answer ----------*/
#res{margin-top:22px}
#res h2{margin:0;font:600 26px/1.1 var(--ui);letter-spacing:-.02em;animation:up .5s var(--e) both}
.stats{display:flex;gap:28px;margin:14px 0}
.stats b{display:block;font:600 22px var(--ui)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0}
td:not(:first-child){text-align:right;color:var(--mu)}
td a{color:var(--tx)}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch button{font-size:13px;min-height:30px}
.ch button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
/*---------- map bits ----------*/
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tx)!important;color:var(--bg);font:600 13px var(--ui);border:2px solid var(--bg);animation:dp .6s var(--e) both}
.mk.sp{width:40px;height:40px;background:var(--bg)!important;color:var(--tx);border:3px solid var(--tx);font-size:18px;animation:land .7s var(--e) both,ring 1.4s .5s ease-out both}
@keyframes dp{from{opacity:0;transform:translateY(-26px) scale(.6)}}
@media (max-width:760px){#card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}
.lnk{padding:4px 0;min-height:0;background:none;color:var(--mu);font-weight:500;font-size:14px}
.lnk:hover{background:none;transform:none;color:var(--tx)}
.ic{width:30px;min-height:30px;padding:0;justify-content:center;background:none;color:var(--mu)}
.rm{opacity:0}
.pr:hover .rm,.pr:focus-within .rm{opacity:1}
@media (hover:none){.rm{opacity:1}}
.sum{margin:12px 0 6px;font:600 18px var(--ui)}
.dot{display:inline-grid;width:20px;height:20px;border-radius:50%;place-items:center;background:var(--tx);color:var(--bg);font:600 11px var(--ui);font-style:normal}
.seg button{font-size:14px;padding:5px 8px}
@keyframes land{from{opacity:0;transform:scale(.2)}}
@keyframes ring{from{box-shadow:0 0 0 0 currentColor}to{box-shadow:0 0 0 24px transparent}}
#res>*{animation:up .55s var(--e) both}
#res>:nth-child(2){animation-delay:.05s}#res>:nth-child(3){animation-delay:.1s}#res>:nth-child(4){animation-delay:.15s}#res>:nth-child(5){animation-delay:.2s}
tr{animation:up .5s var(--e) both}
#go.busy:disabled{opacity:1;animation:br 1.2s ease-in-out infinite}
@keyframes br{50%{opacity:.55}}
.pr:focus-within{z-index:20}
.sg li{display:block}
.sg li b{display:block;font-weight:600;font-size:14px}
.sg li span{color:var(--mu);font-size:12px}
.sg li.on{background:var(--fill2)}
.sg li.none{color:var(--mu);cursor:default}
</style>

<section id="card" aria-label="Meetpoint">
<h1>Meetpoint</h1>
<div id="pp"></div>
<div class="row"><button id="addb" class="lnk">+ Add person</button><button id="me" class="lnk">Use my location</button></div>

<button id="go">Find the best place</button>
<p id="st" role="status" aria-live="polite"></p>
<div id="res"></div>

</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>

// people list and pins

routes.forEach(function(r,k){h+='<tr style="animation-delay:'+(.25+k*.07)+'s"><td><i class="dot">'+(r.i+1)+'</i></td><td>'+dur(r.t)+'</td><td>'+dst(r.d)+'</td></tr>'});h+='</table>';
var pl=placeList();if(pl)h+='<p class="mu" style="margin:18px 0 6px">Other spots nearby</p><div class="ch" id="pl">'+pl+'</div>';
h+='<div class="row"><button class="lnk" id="cp">Copy plan</button><a class="lnk lk" target="_blank" rel="noopener" href="https://maps.apple.com/?ll='+spot.lat+','+spot.lon+'&q='+encodeURIComponent(spot.n)+'">Open in Apple Maps</a></div>';
$('res').innerHTML=h;count(tot,mx);if(window.innerWidth<=760)$('res').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});mapRoutes();
$('cp').onclick=function(){var t='Meet at '+spot.n+'\n'+routes.map(function(r){return 'Person '+(r.i+1)+': '+dur(r.t)+' ('+dst(r.d)+')'}).join('\n')+'\nhttps://maps.apple.com/?ll='+spot.lat+','+spot.lon,b=$('cp');function d(m){b.textContent=m;setTimeout(function(){b.textContent='Copy plan'},1600)}try{navigator.clipboard.writeText(t).then(function(){d('Copied')},function(){d('Copy blocked')})}catch(e){d('Copy blocked')}}}
function count(a,b){var t0=performance.now();(function f(n){if(!$('tt'))return;var k=reduce?1:Math.min(1,(n-t0)/1100),e=1-Math.pow(1-k,3);$('tt').textContent=dur(a*e);$('tl').textContent=dur(b*e);if(k<1)requestAnimationFrame(f)})(t0)}
function placeList(){return places.filter(function(p){return p!==spot}).slice(0,6).map(function(p){return '<button data-pl="'+places.indexOf(p)+'">'+esc(p.n)+'</button>'}).join('')}
function land(){L.marker([spot.lat,spot.lon],{icon:L.divIcon({className:'',html:'<div class="mk sp">★</div>',iconSize:[40,40],iconAnchor:[20,20]}),title:spot.n}).addTo(layer)}
function mapRoutes(){cancelAnimationFrame(rAnim);if(layer)map.removeLayer(layer);layer=L.layerGroup().addTo(map);var all=[],started=false,wide=window.innerWidth>760;routes.forEach(function(r){all=all.concat(r.g)});all.push([spot.lat,spot.lon]);
function start(){if(started)return;started=true;var els=[],bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
routes.forEach(function(r,k){var pl=L.polyline(r.g,{color:COL[r.i],weight:4,opacity:1,lineCap:'round',lineJoin:'round',smoothFactor:1.2}).addTo(layer),el=pl.getElement();if(!el||!el.getTotalLength||reduce)return;var n=el.getTotalLength(),hd=document.createElementNS('http://www.w3.org/2000/svg','circle');hd.setAttribute('r',6);hd.setAttribute('fill',bg);hd.setAttribute('stroke',COL[r.i]);hd.setAttribute('stroke-width',3);hd.style.opacity=0;el.parentNode.appendChild(hd);el.style.strokeDasharray=n;el.style.strokeDashoffset=n;els.push({el:el,n:n,hd:hd,k:k,d:Math.min(2400,Math.max(1100,900+n*1.2))})});
if(!els.length){land();return}
var t0=performance.now();(function f(now){var t=now-t0,done=true;els.forEach(function(x){var p=Math.min(1,Math.max(0,(t-x.k*220)/x.d)),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,pt=x.el.getPointAtLength(x.n*e);x.el.style.strokeDashoffset=x.n*(1-e);x.hd.setAttribute('cx',pt.x);x.hd.setAttribute('cy',pt.y);x.hd.style.opacity=p>0&&p<1?1:0;if(p<1)done=false});
if(!done){rAnim=requestAnimationFrame(f);return}els.forEach(function(x){x.el.style.strokeDasharray='none';x.el.style.strokeDashoffset='';if(x.hd.parentNode)x.hd.parentNode.removeChild(x.hd)});land()})(t0)}
var o={paddingTopLeft:[wide?420:30,40],paddingBottomRight:[30,wide?40:Math.round(window.innerHeight*.6)],animate:!reduce,duration:1.3,easeLinearity:.2},b=L.latLngBounds(all);
if(reduce){map.fitBounds(b,o);start();return}
map.flyToBounds(b,o);map.once('moveend',function(){setTimeout(start,150)});setTimeout(start,1900)}
// event wiring
if(typeof L==='undefined'){say('The map did not load. Check your connection and refresh.',1);return}
map=L.map('map',{zoomControl:false}).setView([30,10],2);L.control.zoom({position:'bottomright'}).addTo(map);
var errs=0,osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map),alt=L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'© OpenStreetMap contributors, tiles by OSM France'});
osm.on('tileerror',function(){if(++errs===6){map.removeLayer(osm);alt.addTo(map)}});
try{var o=JSON.parse(localStorage.getItem('meetpoint-v2')||'null');if(o&&o.length>=2)people=o}catch(e){}
rows();draw();var pts0=people.filter(has);if(pts0.length)map.fitBounds(L.latLngBounds(pts0.map(function(p){return [p.lat,p.lon]})),{paddingTopLeft:[420,60],maxZoom:12});
map.on('click',function(e){if(pick<0)return;var i=pick;pick=-1;$('map').classList.remove('pick');say('');rev(i,e.latlng.lat,e.latlng.lng)});
$('pp').oninput=function(e){var t=e.target;if(t.dataset.a===undefined)return;var i=+t.dataset.a,p=people[i];p.q=t.value;if(has(p)){p.lat=null;p.lon=null;draw()}suggest(i,t.value);save()};
$('pp').onkeydown=function(e){var t=e.target;if(t.dataset.a===undefined)return;var i=+t.dataset.a,s=SG[i]||{items:[],idx:-1};
if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!s.items.length)return;e.preventDefault();s.idx=(s.idx+(e.key==='ArrowDown'?1:-1)+s.items.length)%s.items.length;SG[i]=s;renderSg(i)}
else if(e.key==='Enter'){e.preventDefault();if(s.items.length)pickSg(i,s.idx<0?0:s.idx);else photon(t.value,1).then(function(r){if(r[0])setP(i,r[0].lat,r[0].lon,r[0].label,1);else say('No place found for "'+t.value+'". Add the city, or drop a pin instead.',1)},function(){search(i,t.value)})}
else if(e.key==='Escape')closeSg(i)};

$('pp').onclick=function(e){var bt=e.target.closest('button'),d=bt?bt.dataset:{};if(d.pin!==undefined){pick=+d.pin;$('map').classList.add('pick');say('Click the map to place '+(people[pick].n||'person '+(pick+1))+'.')}
if(d.me!==undefined){var i=+d.me;say('Finding your location…');navigator.geolocation?navigator.geolocation.getCurrentPosition(function(p){say('');rev(i,p.coords.latitude,p.coords.longitude);map.flyTo([p.coords.latitude,p.coords.longitude],14)},function(){say('Location is blocked. Allow it in your browser, or search an address instead.',1)}):say('This browser cannot share a location. Search an address instead.',1)}
if(d.rm!==undefined){people.splice(+d.rm,1);rows();draw();save();if(ran)again()}};
$('addb').onclick=function(){people.push({n:'',q:'',lat:null,lon:null});rows();save()};
$('go').onclick=find;
$('fair').onclick=function(){mode=mode==='sum'?'max':'sum';this.setAttribute('aria-pressed',mode==='max');if(ran)again()};

document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){tmode=b.dataset.t;document.querySelectorAll('[data-t]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});if(ran)again()}});
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});if(ran)again()}});
$('res').onclick=function(e){var d=e.target.dataset;if(d.c){cat=d.c;show()}if(d.pl!==undefined&&!busy){busy=true;say('Updating routes…');choose(places[+d.pl]).catch(function(){say('Could not route to that place. Try another.',1)}).then(function(){busy=false})}};
})();
